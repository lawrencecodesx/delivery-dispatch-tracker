databases:
  - name: delivery-dispatch-db
    databaseName: delivery_dispatch
    user: delivery_dispatch
    plan: basic-256mb
    region: oregon

services:
  - type: web
    name: delivery-dispatch-api
    runtime: python
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: delivery-dispatch-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
